
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <defs>
    <linearGradient id="saffron" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#138808"/>
      <stop offset="100%" stop-color="#006B35"/>
    </linearGradient>
    <path id="wave" d="M0 0 Q300 18 600 0 T1200 0 V72 Q900 90 600 72 T0 72Z"/>
  </defs>

  <!-- Saffron -->
  <rect width="1200" height="73" fill="url(#saffron)"/>

  <!-- White -->
